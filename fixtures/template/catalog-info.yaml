# A scaffolder template: the checker skips files with placeholders.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  annotations:
    github.com/project-slug: ${{ values.destination.owner }}/${{ values.destination.repo }}
spec:
  type: service
  owner: ${{ values.owner }}
  lifecycle: experimental
